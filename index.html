<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kleiderschrank</title>
  <meta name="description" content="Mein Kleiderschrank, Outfits, Wunschliste und Tragen-Statistik">
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Schrank">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Kleiderschrank</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Einstellungen & Backup">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" aria-label="Hinzufügen">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button data-tab="schrank">
      <svg viewBox="0 0 24 24"><path d="M12 8.5V7.6c1.2-.6 2-1.3 2-2.6a2 2 0 1 0-4 0"/><path d="M12 8.5 3.4 14.8c-.8.6-.4 1.7.6 1.7h16c1 0 1.4-1.1.6-1.7z"/></svg>
      <span>Schrank</span>
    </button>
    <button data-tab="kalender">
      <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
      <span>Kalender</span>
    </button>
    <button data-tab="outfits">
      <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      <span>Outfits</span>
    </button>
    <button data-tab="wunsch">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>
      <span>Wünsche</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Statistik</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"><button type="button" id="sheetClose" class="sheet-x" aria-label="Schließen">×</button><div id="sheetBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
